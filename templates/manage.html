</style><style id="uncle-black-theme">:root{color-scheme:dark;--bg:#000;--panel:#090909;--panel2:#080808}html,body{background:#000!important;background-image:none!important}section,article,.panel,.card,.clip,#summary,.style{background:#090909!important}.bg-slate-950,.bg-slate-900{background-color:#080808!important}.bg-slate-800,.bg-slate-700{background-color:#151515!important}input,textarea,select{background-color:#080808!important;border-color:#282828!important}.message.user,.style:has(input:checked){background:#171717!important}header{background:transparent!important}</style><script src="https://cdn.tailwindcss.com"></script><style id="shared-page-width">main{width:100%;max-width:1280px!important;margin-inline:auto!important;padding:24px!important}@media(max-width:640px){main{padding:16px!important}}</style><link rel="stylesheet" href="/static/dark-buttons.css"></head><body><main>{% include "_nav.html" %}<div class="top"><p id="message" class="muted" role="status" aria-live="polite">กำลังโหลด Episodes…</p><button class="primary" onclick="location.href='/ideas'">＋ สร้าง Episode ใหม่</button></div><div id="list"></div><div id="editor" hidden><section><div class="row"><div><small id="episodeSlug" class="badge"></small><h2 id="editHeading">แก้ไข Episode</h2></div><button onclick="closeEditor()">ปิด</button></div><div class="fields"><div><label for="title">ชื่อ EP</label><input id="title" maxlength="2000"></div><div><label for="person">บุคคล / หัวข้อหลัก</label><input id="person" maxlength="2000"></div><div><label for="years">ช่วงปี</label><input id="years" maxlength="2000"></div><div><label for="engineering_focus">ประเด็นหลัก</label><input id="engineering_focus" maxlength="4000"></div></div><label for="fact_check">ข้อควรตรวจสอบ / ความถูกต้อง</label><textarea id="fact_check" rows="3" maxlength="6000"></textarea><label for="intro">บทนำ / Hook</label><textarea id="intro" rows="3" maxlength="6000"></textarea></section><section><div class="row"><div><h2>Scenes</h2><p id="s
